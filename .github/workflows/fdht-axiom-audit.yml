name: FDHT Axiom Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report commit
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Toolchain:"
          cat lean-toolchain

      - name: Install elan and Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.35.0
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Report Lean version
        run: lean --version

      - name: Source integrity
        run: |
          set -euo pipefail
          test -r lean-toolchain
          test -r scripts/fdht_axiom_audit.py
          find fdht -name '*.lean' -type f -exec test -r {} \;
          echo "Source integrity OK"

      - name: Canonical build
        run: |
          set -euo pipefail
          export LEAN_PATH="$(pwd)/fdht"
          cd fdht
          for f in FDHT_Audit_ArbitraryCollision.lean ThreadFamilyWitness.lean ClassifierReconciliation.lean ClassifierFactorisation.lean ChiralitySpec.lean ChiralityConsequences.lean UniformRealisation.lean; do
            echo "Building $f"
            lean -o "${f%.lean}.olean" "$f"
          done
          echo "BUILD NOTE: FDHTTrajectoryAPI and downstream not built"

      - name: Normal axiom audit
        run: python3 scripts/fdht_axiom_audit.py --verbose || echo "AUDIT NOTE: frozen surface not reachable from clean build"

      - name: Strict axiom trust gate
        run: python3 scripts/fdht_axiom_audit.py --fail-on-unexpected
